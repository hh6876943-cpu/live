</head>
<body class="h-full bg-slate-950 text-slate-100 font-sans transition-colors duration-300 selection:bg-indigo-500 selection:text-white">

    <!-- App Root Container -->
    <div id="app" class="min-h-full flex flex-col">
        <!-- Header -->
        <header class="glass-panel sticky top-0 z-50 px-6 py-3.5 flex items-center justify-between shadow-xl">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="router.navigate('home')">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25">
                    <i class="fa-solid fa-play text-base ml-0.5"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 bg-clip-text text-transparent">Zenith LiveEdu Studio</h1>
                    <p class="text-[11px] text-slate-400">Nền tảng Học trực tuyến & Livestream 1080p</p>
                </div>
            </div>
            <div id="nav-actions" class="flex items-center space-x-4">
                <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>
                <div id="user-profile-badge" class="hidden items-center space-x-3 bg-slate-900/90 border border-slate-800 px-4 py-2 rounded-2xl shadow-inner">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white flex items-center justify-center font-extrabold text-xs shadow-md" id="user-avatar-text">U</div>
                    <div>
                        <div class="font-bold text-xs text-slate-200" id="nav-username">Tên người dùng</div>

                    </div>
                    <button onclick="authManager.logout()" class="ml-2 text-rose-400 hover:text-rose-300 p-1.5 transition" title="Đăng xuất">

        <!-- Main View Container -->
        <main class="flex-1 flex flex-col" id="main-view">

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getFirestore, collection, addDoc, setDoc, doc, getDoc, updateDoc, deleteDoc, onSnapshot, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA4b5J69yCLrsQILyZHLC6PNa5RlYBhCxQ",
            authDomain: "live-dd8f9.firebaseapp.com",
            projectId: "live-dd8f9",
            storageBucket: "live-dd8f9.firebasestorage.app",
            messagingSenderId: "751001710449",
            appId: "1:751001710449:web:d75c335918d17fe3d490d0",
            measurementId: "G-B0LJVZS6CJ"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        window.db = db;
        window.FBModules = { collection, addDoc, setDoc, doc, getDoc, updateDoc, deleteDoc, onSnapshot, query, where, getDocs, serverTimestamp };
        
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <!-- Application Engine -->
    <script>
        const State = {
            currentUser: JSON.parse(localStorage.getItem('zenith_user')) || null,
            currentSessionId: localStorage.getItem('zenith_session_id') || null,
            activeUnsubscribers: []
        };

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        const router = {
            navigate: (viewName, params = {}) => {
                State.activeUnsubscribers.forEach(unsub => unsub());
                State.activeUnsubscribers = [];

                updateNavbarProfile();

                const urlParams = new URLSearchParams(window.location.search);
                const roomIdParam = urlParams.get('room') || params.roomId;

                if (roomIdParam) {
                    renderLiveRoom(roomIdParam);
                    return;
                }

                if (!State.currentUser) {
                    renderAuthView();
                    return;
                }

                if (State.currentUser.role === 'admin') {
                    renderAdminDashboard();
                } else {
                    renderStudentDashboard();
                }
            }
        };

        function updateNavbarProfile() {
            const badge = document.getElementById('user-profile-badge');
            if (State.currentUser) {
                badge.classList.remove('hidden');
                badge.classList.add('flex');
                document.getElementById('nav-username').innerText = State.currentUser.name || State.currentUser.username;
                document.getElementById('nav-role').innerText = State.currentUser.role === 'admin' ? 'Quản trị viên' : `Học sinh (${State.currentUser.className || ''})`;
                document.getElementById('user-avatar-text').innerText = (State.currentUser.name || State.currentUser.username).charAt(0).toUpperCase();
            } else {
                badge.classList.add('hidden');
                badge.classList.remove('flex');
            }
        }

        // --- Authentication ---
        const authManager = {
            login: async (username, password, selectedClass = '') => {
                const db = window.db;
                const { collection, query, where, getDocs, setDoc, doc, serverTimestamp, addDoc } = window.FBModules;

                try {
                    if (username === 'admin' && password === 'admin123') {
                        const adminUser = { username: 'admin', name: 'Quản Trị Viên', role: 'admin' };
                        authManager.setSession(adminUser);
                        return { success: true };
                    }

                    const q = query(collection(db, 'users'), where('username', '==', username), where('password', '==', password));
                    const snapshot = await getDocs(q);

                    if (snapshot.empty) {
                        return { success: false, message: 'Tên đăng nhập hoặc mật khẩu không chính xác!' };
                    }

                    const userDoc = snapshot.docs[0];
                    const user = { id: userDoc.id, ...userDoc.data() };

                    if (user.role === 'student' && user.className !== selectedClass) {
                        return { success: false, message: 'Lớp học đã chọn không thuộc tài khoản của bạn!' };
                    }

                    const sessionId = 'sess_' + Math.random().toString(36).substring(2, 15) + Date.now();
                    await setDoc(doc(db, 'users', user.id), { 
                        activeSessionId: sessionId,
                        lastLogin: serverTimestamp(),
                        deviceInfo: navigator.userAgent
                    }, { merge: true });

                    authManager.setSession(user, sessionId);

                    await addDoc(collection(db, 'activities'), {
                        userId: user.id,
                        username: user.username,
                        name: user.name,
                        className: user.className || 'Admin',
                        device: navigator.userAgent,
                        loginAt: new Date().toISOString(),
                        logoutAt: null
                    });

                    return { success: true };
                } catch (err) {
                    console.error(err);
                    return { success: false, message: 'Lỗi Firebase: ' + err.message };
                }
            },

            setSession: (user, sessionId = null) => {
                State.currentUser = user;
                localStorage.setItem('zenith_user', JSON.stringify(user));
                if (sessionId) {
                    State.currentSessionId = sessionId;
                    localStorage.setItem('zenith_session_id', sessionId);
                }
                
                if (user.role === 'student') {
                    const { doc, onSnapshot } = window.FBModules;
                    const unsub = onSnapshot(doc(window.db, 'users', user.id), (docSnap) => {
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            if (data.activeSessionId && data.activeSessionId !== State.currentSessionId) {
                                alert('Tài khoản của bạn đã đăng nhập ở thiết bị khác!');
                                authManager.logout(false);
                            }
                        }
                    });
                    State.activeUnsubscribers.push(unsub);
                }

                router.navigate('home');
            },

            logout: async (callServer = true) => {
                if (State.currentUser && State.currentUser.id && callServer) {
                    try {
                        const { collection, addDoc } = window.FBModules;
                        await addDoc(collection(window.db, 'activities'), {
                            userId: State.currentUser.id,
                            username: State.currentUser.username,
                            name: State.currentUser.name,
                            logoutAt: new Date().toISOString()
                        });
                    } catch(e) {}
                }
                State.currentUser = null;
                State.currentSessionId = null;
                localStorage.removeItem('zenith_user');
                localStorage.removeItem('zenith_session_id');
                window.history.pushState({}, '', window.location.pathname);
                router.navigate('home');
            }
        };

        // --- Render Auth View ---
        function renderAuthView() {
            const main = document.getElementById('main-view');
            main.innerHTML = `
                <div class="flex-1 flex items-center justify-center px-4 py-12">
                    <div class="glass-panel max-w-md w-full p-8 rounded-3xl shadow-2xl relative overflow-hidden bg-slate-900/90 border border-slate-800">
                        <div class="absolute -top-12 -right-12 w-44 h-44 bg-indigo-600/20 rounded-full blur-3xl"></div>
                        <div class="text-center mb-8">
                            <h2 class="text-2xl font-extrabold tracking-tight text-white mb-1.5">Đăng Nhập Hệ Thống</h2>
                            <p class="text-xs text-slate-400">Zenith LiveEdu Studio - Hệ thống Livestream Học tập</p>
                        </div>
                        <form id="login-form" class="space-y-5">
                            <div>
                                <label class="block text-[11px] font-bold uppercase tracking-wider mb-2 text-slate-400">Chọn Vai Trò</label>
                                <div class="grid grid-cols-2 gap-3">
                                    <button type="button" onclick="setRoleTab('student')" id="role-student-btn" class="py-2.5 px-4 rounded-xl font-bold text-xs border border-indigo-500 bg-indigo-500/10 text-indigo-400 transition">Học Sinh</button>
                                    <button type="button" onclick="setRoleTab('admin')" id="role-admin-btn" class="py-2.5 px-4 rounded-xl font-bold text-xs border border-slate-700 text-slate-400 transition">Quản Trị Viên</button>
                                </div>
                            </div>
                            <div id="student-class-group">
                                <label class="block text-[11px] font-bold uppercase tracking-wider mb-2 text-slate-400">Lớp Học</label>
                                <select id="login-class" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition">
                                    <option value="">-- Đang tải danh sách lớp --</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold uppercase tracking-wider mb-2 text-slate-400">Tên Đăng Nhập</label>
                                <input type="text" id="login-username" required placeholder="Nhập tên đăng nhập..." class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold uppercase tracking-wider mb-2 text-slate-400">Mật Khẩu</label>
                                <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition">
                            </div>
                            <button type="submit" class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:from-indigo-500 hover:to-pink-500 text-white font-bold text-sm shadow-lg shadow-indigo-600/30 transition transform active:scale-[0.98]">
                                Đăng Nhập Ngay
                            </button>
                        </form>
                    </div>
                </div>
            `;

            window.currentLoginRole = 'student';
            loadClassesForLoginDropdown();

            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('login-username').value.trim();
                const password = document.getElementById('login-password').value.trim();
                const selectedClass = document.getElementById('login-class').value;

                if (window.currentLoginRole === 'student' && !selectedClass) {
                    alert('Vui lòng chọn lớp học!');
                    return;
                }

                const res = await authManager.login(window.currentLoginRole === 'admin' ? 'admin' : username, password, selectedClass);
                if (!res.success) alert(res.message);
            });
        }

        window.setRoleTab = (role) => {
            window.currentLoginRole = role;
            const studentBtn = document.getElementById('role-student-btn');
            const adminBtn = document.getElementById('role-admin-btn');
            const classGroup = document.getElementById('student-class-group');
            const usernameInput = document.getElementById('login-username');

            if (role === 'student') {
                studentBtn.className = "py-2.5 px-4 rounded-xl font-bold text-xs border border-indigo-500 bg-indigo-500/10 text-indigo-400 transition";
                adminBtn.className = "py-2.5 px-4 rounded-xl font-bold text-xs border border-slate-700 text-slate-400 transition";
                classGroup.style.display = 'block';
                usernameInput.value = '';
                usernameInput.placeholder = 'Nhập tên đăng nhập học sinh...';
            } else {
                adminBtn.className = "py-2.5 px-4 rounded-xl font-bold text-xs border border-indigo-500 bg-indigo-500/10 text-indigo-400 transition";
                studentBtn.className = "py-2.5 px-4 rounded-xl font-bold text-xs border border-slate-700 text-slate-400 transition";
                classGroup.style.display = 'none';
                usernameInput.value = 'admin';
                usernameInput.placeholder = 'admin';
            }
        }

        async function loadClassesForLoginDropdown() {
            try {
                const { collection, getDocs } = window.FBModules;
                const snap = await getDocs(collection(window.db, 'classes'));
                const select = document.getElementById('login-class');
                if (!select) return;
                select.innerHTML = '<option value="">-- Chọn lớp học --</option>';
                snap.forEach(docSnap => {
                    const c = docSnap.data();
                    select.innerHTML += `<option value="${c.name}">${c.name} - ${c.description || ''}</option>`;
                });
            } catch(e) {}
        }

        // --- Admin Dashboard ---
        async function renderAdminDashboard() {
            const main = document.getElementById('main-view');
            main.innerHTML = `
                <div class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-8">

                        <div>
                            <h2 class="text-2xl font-extrabold text-white">Bảng Quản Trị Viên Studio 👋</h2>

                        </div>
                        <button onclick="openCreateLiveModal()" class="px-5 py-3 rounded-2xl bg-gradient-to-r from-rose-500 via-pink-600 to-purple-600 hover:opacity-90 text-white font-bold text-sm shadow-lg shadow-rose-500/25 transition flex items-center space-x-2">
                            <i class="fa-solid fa-tower-broadcast"></i>

                                <h3 class="text-base font-bold text-white mb-4 flex items-center space-x-2">
                                    <i class="fa-solid fa-school text-indigo-400"></i>
                                    <span>Tạo Lớp Học Mới</span>
                                </h3>
                                <form id="create-class-form" class="space-y-4">
                                    <div>
                                        <label class="block text-[11px] font-bold uppercase tracking-wider mb-2 text-slate-400">Tên Lớp</label>
                                        <input type="text" id="class-name" required placeholder="VD: 12A1 - Toán" class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-slate-200 outline-none focus:ring-2 focus:ring-indigo-500">
                                    </div>
                                    <div>
                                        <label class="block text-[11px] font-bold uppercase tracking-wider mb-2 text-slate-400">Mô Tả</label>
                                        <input type="text" id="class-desc" placeholder="VD: Khóa Luyện thi Bách Khoa" class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-slate-200 outline-none focus:ring-2 focus:ring-indigo-500">
                                    </div>
                                    <button type="submit" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm transition shadow-md shadow-indigo-600/20">Tạo Lớp</button>

                                <h3 class="text-base font-bold text-white mb-4 flex items-center space-x-2">

                                        <select id="student-class-select" required class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-slate-200 outline-none focus:ring-2 focus:ring-indigo-500">
                                            <option value="">-- Chọn lớp --</option>
                                        </select>
                                    </div>
                                    <div>

        // Global Media & WebRTC Stream State
        let localStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        const peerConnections = {};

        const servers = {
            iceServers: [
                { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }
            ]
        };

        async function initLiveRoomLogic(roomId, isAdmin) {
            const { doc, getDoc, collection, addDoc, setDoc, onSnapshot, deleteDoc } = window.FBModules;

            const roomSnap = await getDoc(doc(window.db, 'rooms', roomId));
            if (roomSnap.exists()) {
                const roomData = roomSnap.data();
                const badge = document.getElementById('room-title-badge');
                if (badge) badge.innerText = roomData.title + ' (1080p)';
            }

            // Realtime Chat Listener
            const chatCol = collection(window.db, 'rooms', roomId, 'chats');
            const unsubChat = onSnapshot(chatCol, (snapshot) => {
                const chatBox = document.getElementById('chat-messages');
                if (!chatBox) return;
                chatBox.innerHTML = '';
                const messages = [];
                snapshot.forEach(d => messages.push(d.data()));
                messages.sort((a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0));

                messages.forEach(msg => {
                    chatBox.innerHTML += `
                        <div class="flex flex-col">
                            <div class="flex items-center space-x-2">
                                <span class="font-bold text-xs text-indigo-400">${msg.name}</span>
                                <span class="text-[10px] text-slate-500">${new Date(msg.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                            </div>
                            <p class="text-xs bg-slate-800/80 text-slate-200 p-2.5 rounded-xl mt-1 border border-slate-700/60">${msg.text}</p>
                        </div>
                    `;
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            });
            State.activeUnsubscribers.push(unsubChat);

            // Realtime Reactions
            const reactCol = collection(window.db, 'rooms', roomId, 'reactions');
            const unsubReact = onSnapshot(reactCol, (snapshot) => {
                snapshot.docChanges().forEach(change => {
                    if (change.type === 'added') {
                        showFloatingReaction(change.doc.data().emoji);
                    }
                });
            });
            State.activeUnsubscribers.push(unsubReact);

            // Realtime Attached Documents Listener (Docs/YouTube/Drive)
            const docsCol = collection(window.db, 'rooms', roomId, 'attachedDocs');
            const unsubDocs = onSnapshot(docsCol, (snapshot) => {
                const bar = document.getElementById('active-docs-bar');
                const list = document.getElementById('pinned-docs-list');
                if (!bar || !list) return;

                if (snapshot.empty) {
                    bar.classList.add('hidden');
                    bar.classList.remove('flex');
                    return;
                }

                bar.classList.remove('hidden');
                bar.classList.add('flex');
                list.innerHTML = '';

                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    list.innerHTML += `
                        <button onclick="openEmbeddedDoc('${data.url}', '${data.title}')" class="px-3 py-1.5 rounded-xl bg-indigo-500/20 hover:bg-indigo-500/30 border border-indigo-500/40 text-indigo-300 font-semibold text-xs flex items-center space-x-1.5 transition">
                            <i class="fa-solid fa-file-lines text-[10px]"></i>
                            <span class="truncate max-w-[150px]">${data.title}</span>
                        </button>
                    `;
                });
            });
            State.activeUnsubscribers.push(unsubDocs);

            // Chat Submit
            document.getElementById('chat-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const input = document.getElementById('chat-input');
                const text = input.value.trim();
                if (!text) return;

                await addDoc(collection(window.db, 'rooms', roomId, 'chats'), {
                    name: State.currentUser ? (State.currentUser.name || State.currentUser.username) : 'Học sinh',
                    text,
                    createdAt: new Date().toISOString()
                });
                input.value = '';
            });

            // WEBRTC SIGNALING LOGIC
            const roomRef = doc(window.db, 'rooms', roomId);

            if (isAdmin) {
                window.startScreenShare = async () => {
                    try {
                        // Request 1080p high quality screen share
                        localStream = await navigator.mediaDevices.getDisplayMedia({ 
                            video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } }, 
                            audio: true 
                        });

                        const videoPlayer = document.getElementById('live-video-player');
                        videoPlayer.srcObject = localStream;
                        videoPlayer.muted = true;
                        document.getElementById('video-placeholder').classList.add('hidden');

                        document.getElementById('btn-start-share').disabled = true;
                        document.getElementById('btn-stop-share').disabled = false;

                        // MediaRecorder with VP9 & low bitrate optimization for smallest size
                        recordedChunks = [];
                        const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus') ? 'video/webm;codecs=vp9,opus' : 'video/webm';
                        mediaRecorder = new MediaRecorder(localStream, { 
                            mimeType: mimeType, 
                            videoBitsPerSecond: 1500000 // 1.5 Mbps for 1080p smallest filesize
                        });
                        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                        mediaRecorder.start(1000);

                        await setDoc(roomRef, { isLive: true }, { merge: true });

                        const callsCol = collection(window.db, 'rooms', roomId, 'calls');
                        const unsubCalls = onSnapshot(callsCol, (snapshot) => {
                            snapshot.docChanges().forEach(async (change) => {
                                const callId = change.doc.id;
                                const callData = change.doc.data();

                                if (change.type === 'added' || (callData && callData.studentOffer && !peerConnections[callId])) {
                                    if (!callData.studentOffer) return;

                                    const pc = new RTCPeerConnection(servers);
                                    peerConnections[callId] = pc;

                                    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

                                    const adminCandidatesCol = collection(window.db, 'rooms', roomId, 'calls', callId, 'adminCandidates');
                                    pc.onicecandidate = (e) => {
                                        if (e.candidate) addDoc(adminCandidatesCol, e.candidate.toJSON());
                                    };

                                    await pc.setRemoteDescription(new RTCSessionDescription(callData.studentOffer));
                                    const answer = await pc.createAnswer();
                                    await pc.setLocalDescription(answer);

                                    await setDoc(doc(window.db, 'rooms', roomId, 'calls', callId), {
                                        adminAnswer: { type: answer.type, sdp: answer.sdp }
                                    }, { merge: true });

                                    const studentCandidatesCol = collection(window.db, 'rooms', roomId, 'calls', callId, 'studentCandidates');
                                    onSnapshot(studentCandidatesCol, (candSnap) => {
                                        candSnap.docChanges().forEach((cChange) => {
                                            if (cChange.type === 'added') {
                                                pc.addIceCandidate(new RTCIceCandidate(cChange.doc.data()));
                                            }
                                        });
                                    });
                                }
                            });
                        });
                        State.activeUnsubscribers.push(unsubCalls);

                        localStream.getVideoTracks()[0].onended = () => { confirmEndLive(roomId); };

                    } catch (err) {
                        alert('Lỗi chia sẻ màn hình: ' + err.message);
                    }
                };

                window.confirmEndLive = (roomId) => {
                    const wantDownload = confirm('Bạn có muốn tải video ghi hình 1080p của buổi live về máy không?');
                    
                    if (wantDownload) {
                        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                            mediaRecorder.stop();
                            mediaRecorder.onstop = () => {
                                const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                                const url = URL.createObjectURL(blob);
                                const a = document.createElement('a');
                                a.style.display = 'none';
                                a.href = url;
                                a.download = `LiveStream_1080p_${roomId}.mp4`;
                                document.body.appendChild(a);
                                a.click();
                                setTimeout(() => {
                                    document.body.removeChild(a);
                                    window.URL.revokeObjectURL(url);
                                    cleanupRoomData(roomId);
                                }, 200);
                            };
                        } else {
                            cleanupRoomData(roomId);
                        }
                    } else {
                        cleanupRoomData(roomId);
                    }
                };

                async function cleanupRoomData(roomId) {
                    if (localStream) localStream.getTracks().forEach(t => t.stop());
                    Object.values(peerConnections).forEach(pc => pc.close());

                    try {
                        await deleteDoc(doc(window.db, 'rooms', roomId));
                        alert('Đã kết thúc buổi live và xóa dữ liệu phòng thành công!');
                        router.navigate('home');
                    } catch(e) { console.error(e); }
                }

            } else {
                // STUDENT SIDE
                const studentId = 'st_' + Math.random().toString(36).substring(2, 9);
                const callDocRef = doc(window.db, 'rooms', roomId, 'calls', studentId);
                const pc = new RTCPeerConnection(servers);

                pc.ontrack = (event) => {
                    const videoPlayer = document.getElementById('live-video-player');
                    videoPlayer.srcObject = event.streams[0];
                    document.getElementById('video-placeholder').classList.add('hidden');
                };

                const studentCandCol = collection(window.db, 'rooms', roomId, 'calls', studentId, 'studentCandidates');
                pc.onicecandidate = (e) => {
                    if (e.candidate) addDoc(studentCandCol, e.candidate.toJSON());
                };

                pc.addTransceiver('video', { direction: 'recvonly' });
                pc.addTransceiver('audio', { direction: 'recvonly' });

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                await setDoc(callDocRef, {
                    studentOffer: { type: offer.type, sdp: offer.sdp }
                });

                const unsubCall = onSnapshot(callDocRef, async (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data.adminAnswer && !pc.currentRemoteDescription) {
                            await pc.setRemoteDescription(new RTCSessionDescription(data.adminAnswer));
                        }
                    }
                });
                State.activeUnsubscribers.push(unsubCall);

                const adminCandCol = collection(window.db, 'rooms', roomId, 'calls', studentId, 'adminCandidates');
                const unsubAdminCand = onSnapshot(adminCandCol, (snapshot) => {
                    snapshot.docChanges().forEach((change) => {
                        if (change.type === 'added') {
                            pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                        }
                    });
                });
                State.activeUnsubscribers.push(unsubAdminCand);
            }
        }

        // --- Document Viewer Modal ---
        window.openEmbeddedDoc = (rawUrl, title) => {
            const modal = document.getElementById('embedded-doc-container');
            const wrapper = document.getElementById('doc-iframe-wrapper');
            const titleEl = document.getElementById('doc-title-text');

            if (!modal || !wrapper) return;

            let embedUrl = rawUrl;

            // YouTube conversion
            if (rawUrl.includes('youtube.com/watch?v=')) {
                const vId = rawUrl.split('v=')[1].split('&')[0];
                embedUrl = `https://www.youtube.com/embed/${vId}?autoplay=1`;
            } else if (rawUrl.includes('youtu.be/')) {
                const vId = rawUrl.split('youtu.be/')[1].split('?')[0];
                embedUrl = `https://www.youtube.com/embed/${vId}?autoplay=1`;
            }
            // Google Docs / Drive conversion
            else if (rawUrl.includes('docs.google.com') || rawUrl.includes('drive.google.com')) {
                embedUrl = rawUrl.replace('/edit', '/preview').replace('/view', '/preview');
            }

            titleEl.innerText = title || 'Tài Liệu Đăng Tải';
            wrapper.innerHTML = `<iframe src="${embedUrl}" class="w-full h-full rounded-xl border-0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.closeEmbeddedDoc = () => {
            const modal = document.getElementById('embedded-doc-container');
            const wrapper = document.getElementById('doc-iframe-wrapper');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
            if (wrapper) wrapper.innerHTML = '';
        };

        window.openAttachDocModal = async (roomId) => {
            const title = prompt('Nhập tên tài liệu / video:');
            if (!title) return;
            const url = prompt('Dán link YouTube, Google Docs, Drive, PDF... vào đây:');
            if (!url) return;

            try {
                const { collection, addDoc } = window.FBModules;
                await addDoc(collection(window.db, 'rooms', roomId, 'attachedDocs'), {
                    title,
                    url,
                    createdAt: new Date().toISOString()
                });
                alert('Đã ghim tài liệu lên màn hình live thành công!');
            } catch(e) {
                alert('Lỗi ghim tài liệu: ' + e.message);
            }
        };

        window.sendReaction = async (emoji) => {
            const { collection, addDoc } = window.FBModules;
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('room');
            if (!roomId) return;

            await addDoc(collection(window.db, 'rooms', roomId, 'reactions'), {
                emoji,
                createdAt: new Date().toISOString()
            });
        };

        function showFloatingReaction(emoji) {
            const container = document.getElementById('reactions-overlay');
            if (!container) return;
            const el = document.createElement('div');
            el.className = 'floating-reaction';
            el.innerText = emoji;
            el.style.left = Math.random() * 80 + 10 + '%';
            container.appendChild(el);
            setTimeout(() => el.remove(), 2800);
        }

        window.showEmbedModal = (roomId) => {
            const embedCode = `<iframe src="${window.location.origin}${window.location.pathname}?room=${roomId}" width="100%" height="600px" frameborder="0" allow="camera; microphone; fullscreen; display-capture"></iframe>`;
            prompt("Sao chép mã nhúng (Embed) dưới đây để đưa vào website khác:", embedCode);
        };

        // App Boot
        window.addEventListener('firebase-ready', () => { router.navigate('home'); });
        if (window.db) { router.navigate('home'); }
    </script>
</body>
</html>
